@if (!_isEditing) {
<span class="oui-chip-focus-overlay"></span>
} @if (_hasLeadingActionIcon()) {
<span class="oui-chip__cell oui-chip__cell--leading" role="gridcell">
  <ng-content select="[ouiChipEdit]"></ng-content>
</span>
}
<span
  class="oui-chip__cell oui-chip__cell--primary"
  role="gridcell"
  ouiChipAction
  [disabled]="disabled"
  [attr.aria-description]="ariaDescription"
  [attr.aria-label]="ariaLabel"
>
  @if (leadingIcon) {
  <span class="oui-chip__graphic oui-chip-graphic">
    <ng-content select="oui-chip-avatar, [ouiChipAvatar]"></ng-content>
  </span>
  }

  <span class="oui-chip__text-label oui-chip-action-label">
    @if (_isEditing) { @if (contentEditInput) {
    <ng-content select="[ouiChipEditInput]"></ng-content>
    } @else {
    <span ouiChipEditInput></span>
    } } @else {
    <ng-content></ng-content>
    }

    <span class="oui-chip-primary-focus-indicator" aria-hidden="true"></span>
  </span>
</span>

@if (_hasTrailingIcon()) {
<span class="oui-chip__cell oui-chip__cell--trailing" role="gridcell">
  <ng-content
    select="oui-chip-trailing-icon,[ouiChipRemove],[ouiChipTrailingIcon]"
  ></ng-content>
</span>
}
